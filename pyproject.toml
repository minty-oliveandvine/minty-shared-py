[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minty-shared"
version = "0.4.0"
description = "Minty's shared Python for every backend: logging, config, money, time, tokens, storage, document reading (AI), and the Django error envelope."
requires-python = ">=3.13"
# tzdata: minty_shared.time needs the IANA database, which Windows does not have and a slim
# image may not either.
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
# minty_shared.jwt: the service assertion and the bearer decode.
jwt = ["PyJWT>=2.8,<3.0"]
# minty_shared.django: the request middleware, the error envelope, the proxy client.
django = ["django>=5.2,<6.0", "django-ninja>=1.3,<2.0", "requests>=2.28,<3.0"]
# minty_shared.testing: the Postgres-harness pytest plugin and the guard-test helpers.
testing = ["pytest>=8", "pytest-django>=4.8"]
# minty_shared.storage: files into B2 through the S3 API, stored as uploaded.
storage = ["boto3>=1.35,<2.0"]
# minty_shared.ai + minty_shared.model_input: reading a receipt or invoice with Gemini, and the
# small copy the model reads. pydantic stays loose: each API pins its own (its OpenAPI contract).
ai = ["google-genai>=2.22,<3", "pydantic>=2.13,<3", "Pillow>=11.0,<12.0", "pikepdf>=9.4,<10.0"]
dev = [
  "minty-shared[jwt,django,testing,storage,ai]",
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.setuptools.packages.find]
include = ["minty_shared*"]

[tool.setuptools.package-data]
minty_shared = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-django (the testing extra) runs the minty_shared.django tests against tests/djangoapp.
DJANGO_SETTINGS_MODULE = "tests.djangoapp.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = [
  # long docstrings and comments are the house style (as in minty-subscription-api)
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["minty_shared"]

[tool.pyright]
include = ["minty_shared"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# Strict on the framework-free modules; standard on the Django-facing ones, because Django
# ships no type information (django-stubs is not a dependency), so strict would report every
# Django call as unknown rather than find anything.
typeCheckingMode = "standard"
strict = [
  "minty_shared/__init__.py",
  "minty_shared/config.py",
  "minty_shared/log.py",
  "minty_shared/logctx.py",
  "minty_shared/money.py",
  "minty_shared/time.py",
  "minty_shared/tokens.py",
]
